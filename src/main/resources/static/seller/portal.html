<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Seller Central: India Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#eaeded] min-h-screen flex flex-col text-xs text-[#0f1111]">

  <!-- HEADER -->
  <header class="bg-[#131921] text-white px-6 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <span class="text-xl font-bold tracking-tight text-[#febd69]">Seller<span class="text-white">Central</span></span>
      <span class="bg-gray-800 text-gray-300 text-[10px] px-2 py-0.5 rounded border border-gray-700">India Marketplace</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="merchantStatus" class="text-gray-400">Not Logged In</span>
      <button id="logoutBtn" onclick="logoutMerchant()" class="text-red-400 hover:underline hidden">Log Out</button>
      <a href="/" class="amazon-gold-btn bg-[#febd69] hover:bg-[#f3a847] text-black font-bold px-3 py-1.5 rounded">Visit Buyer Store</a>
    </div>
  </header>

  <!-- AUTHENTICATION CONTAINER (LOGIN + REGISTER TABS) -->
  <div id="authBox" class="max-w-md mx-auto my-12 bg-white border border-gray-300 rounded-lg p-6 shadow-md w-full">
    <!-- Tab Switcher -->
    <div class="flex border-b border-gray-200 mb-6">
      <button id="tabLoginBtn" onclick="switchTab('login')" class="flex-1 pb-2 font-bold text-sm text-[#0f1111] border-b-2 border-[#f08804]">Merchant Sign In</button>
      <button id="tabRegisterBtn" onclick="switchTab('register')" class="flex-1 pb-2 font-bold text-sm text-gray-500 border-b-2 border-transparent">Register New Seller</button>
    </div>

    <!-- 1. SIGN IN FORM -->
    <form id="loginForm" onsubmit="handleMerchantAuth(event, 'login')" class="space-y-4">
      <div>
        <label class="block font-bold mb-1">Registered Merchant Email</label>
        <input id="loginEmail" type="email" value="appario@indiansmarket.in" required class="w-full border border-gray-400 p-2.5 rounded focus:outline-none focus:border-amber-500" />
      </div>
      <div>
        <label class="block font-bold mb-1">Password</label>
        <input id="loginPassword" type="password" value="Carelon16sep" required class="w-full border border-gray-400 p-2.5 rounded focus:outline-none focus:border-amber-500" />
      </div>
      <button type="submit" class="w-full bg-[#f0c14b] hover:bg-[#eeb933] border border-[#a88734] font-bold py-2.5 rounded shadow-sm text-black">
        Access Merchant Studio
      </button>
    </form>

    <!-- 2. NEW SELLER REGISTRATION FORM -->
    <form id="registerForm" onsubmit="handleMerchantAuth(event, 'register')" class="space-y-4 hidden">
      <div>
        <label class="block font-bold mb-1">Legal Company / Store Name *</label>
        <input id="regStoreName" required placeholder="e.g. Hawk Electronics Store" class="w-full border border-gray-400 p-2.5 rounded focus:outline-none focus:border-amber-500" />
      </div>
      <div>
        <label class="block font-bold mb-1">Business Email ID *</label>
        <input id="regEmail" type="email" required placeholder="seller@hawkstore.in" class="w-full border border-gray-400 p-2.5 rounded focus:outline-none focus:border-amber-500" />
      </div>
      <div>
        <label class="block font-bold mb-1">Create Password *</label>
        <input id="regPassword" type="password" required placeholder="••••••••" class="w-full border border-gray-400 p-2.5 rounded focus:outline-none focus:border-amber-500" />
      </div>
      <div>
        <label class="block font-bold mb-1">Warehouse Dispatch State *</label>
        <select id="regState" class="w-full border border-gray-400 p-2.5 rounded">
          <option value="Delhi NCR">Delhi NCR</option>
          <option value="Maharashtra">Maharashtra (Mumbai Hub)</option>
          <option value="Karnataka">Karnataka (Bengaluru Hub)</option>
          <option value="Telangana">Telangana (Hyderabad Hub)</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-[#f0c14b] hover:bg-[#eeb933] border border-[#a88734] font-bold py-2.5 rounded shadow-sm text-black">
        Register & Launch Storefront
      </button>
    </form>
  </div>

  <!-- DASHBOARD AFTER LOGIN -->
  <main id="dashboard" class="hidden max-w-6xl mx-auto p-6 w-full space-y-6">
    <div class="bg-white p-5 rounded-lg border shadow-sm flex justify-between items-center">
      <div>
        <div class="flex items-center gap-2">
          <h2 id="merchantStoreTitle" class="text-xl font-bold text-gray-900">Merchant Store</h2>
          <span id="tierBadge" class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2 py-0.5 rounded border border-amber-300">SILVER TIER</span>
        </div>
        <p id="merchantEmailDisplay" class="text-gray-500 mt-1"></p>
      </div>
      <button onclick="document.getElementById('productListingModal').classList.remove('hidden')" class="bg-[#f0c14b] hover:bg-[#eeb933] border border-[#a88734] font-bold px-4 py-2 rounded text-black">
        + List New Product
      </button>
    </div>

    <!-- Live SKU Table -->
    <div class="bg-white border rounded-lg p-5 shadow-sm">
      <h3 class="font-bold text-sm mb-3">Your Live Catalog SKUs</h3>
      <table class="w-full text-left border">
        <thead class="bg-gray-100 text-gray-700">
          <tr>
            <th class="p-2.5 border-b">ID</th>
            <th class="p-2.5 border-b">Product Name</th>
            <th class="p-2.5 border-b">Category</th>
            <th class="p-2.5 border-b">Price (INR)</th>
            <th class="p-2.5 border-b">Stock Status</th>
          </tr>
        </thead>
        <tbody id="sellerProductsTable">
          <tr><td colspan="5" class="p-4 text-center text-gray-400">Loading catalog...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- MODAL: ADD PRODUCT -->
  <div id="productListingModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm">Add New Product to Indians Market Catalog</h3>
        <button onclick="document.getElementById('productListingModal').classList.add('hidden')" class="text-gray-400 hover:text-black font-bold text-xl">&times;</button>
      </div>
      <form onsubmit="handleCreateProduct(event)" class="space-y-3">
        <div>
          <label class="block font-bold mb-1">Product Title *</label>
          <input id="pName" required placeholder="e.g. Boat Rockerz 450 Bluetooth Headphones" class="w-full border p-2 rounded" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold mb-1">Category *</label>
            <select id="pCategory" class="w-full border p-2 rounded">
              <option value="Electronics">Electronics</option>
              <option value="Audio">Audio</option>
              <option value="Laptops">Laptops</option>
              <option value="Wearables">Wearables</option>
              <option value="Gaming">Gaming</option>
              <option value="Photography">Photography</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1">Price (₹) *</label>
            <input id="pPrice" type="number" step="0.01" required placeholder="1499.00" class="w-full border p-2 rounded" />
          </div>
        </div>
        <div>
          <label class="block font-bold mb-1">Image URL</label>
          <input id="pImageUrl" placeholder="https://images.unsplash.com/..." class="w-full border p-2 rounded" />
        </div>
        <div>
          <label class="block font-bold mb-1">Brand Name</label>
          <input id="pBrand" placeholder="Boat, Sony, Apple" class="w-full border p-2 rounded" />
        </div>
        <button type="submit" class="w-full bg-[#f0c14b] hover:bg-[#eeb933] font-bold py-2 rounded text-black mt-2">Publish SKU to Marketplace</button>
      </form>
    </div>
  </div>

  <script>
    let activeSeller = JSON.parse(localStorage.getItem('im_seller_session') || 'null');

    function switchTab(mode) {
      if (mode === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('tabLoginBtn').className = 'flex-1 pb-2 font-bold text-sm text-[#0f1111] border-b-2 border-[#f08804]';
        document.getElementById('tabRegisterBtn').className = 'flex-1 pb-2 font-bold text-sm text-gray-500 border-b-2 border-transparent';
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('tabRegisterBtn').className = 'flex-1 pb-2 font-bold text-sm text-[#0f1111] border-b-2 border-[#f08804]';
        document.getElementById('tabLoginBtn').className = 'flex-1 pb-2 font-bold text-sm text-gray-500 border-b-2 border-transparent';
      }
    }

    async function handleMerchantAuth(e, type) {
      e.preventDefault();
      let payload = {};

      if (type === 'login') {
        payload = {
          email: document.getElementById('loginEmail').value.trim(),
          password: document.getElementById('loginPassword').value.trim()
        };
      } else {
        payload = {
          accountType: 'SELLER',
          storeName: document.getElementById('regStoreName').value.trim(),
          email: document.getElementById('regEmail').value.trim(),
          password: document.getElementById('regPassword').value.trim(),
          sellerState: document.getElementById('regState').value
        };
      }

      const endpoint = type === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/register';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          activeSeller = data;
          if (type === 'register') {
            activeSeller.storeName = payload.storeName;
          }
          localStorage.setItem('im_seller_session', JSON.stringify(activeSeller));
          initializeDashboard();
        } else {
          alert(data.message || "Authentication failed.");
        }
      } catch(err) {
        alert("Server communication error.");
      }
    }

    function initializeDashboard() {
      if (!activeSeller || !activeSeller.email) return;

      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('merchantStatus').innerText = "Logged in: " + activeSeller.email;

      const storeTitle = activeSeller.storeName || (activeSeller.email.split('@')[0].toUpperCase() + " Store");
      document.getElementById('merchantStoreTitle').innerText = storeTitle;
      document.getElementById('merchantEmailDisplay').innerText = activeSeller.email;
      loadSellerProducts();
    }

    async function loadSellerProducts() {
      try {
        const storeName = activeSeller.storeName || activeSeller.email.split('@')[0];
        const res = await fetch(`/api/v1/products/seller?sellerStoreName=${encodeURIComponent(storeName)}`);
        const prods = await res.json();
        const tbody = document.getElementById('sellerProductsTable');
        
        if (!prods || !prods.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="p-8 text-center text-gray-500 font-bold">
                No active listings yet in your inventory.<br>
                <span class="text-xs font-normal text-gray-400">Click <strong>"+ List New Product"</strong> above to launch your first SKU on Indians Market!</span>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = prods.map(p => `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-2.5 font-mono">${p.id}</td>
            <td class="p-2.5 font-bold text-gray-900">${p.name}</td>
            <td class="p-2.5 text-gray-600">${p.category || 'Electronics'}</td>
            <td class="p-2.5 font-bold text-emerald-700">₹${p.price.toFixed(2)}</td>
            <td class="p-2.5 text-emerald-600 font-bold">✓ Active in Storefront</td>
          </tr>
        `).join('');
      } catch(e) {
        console.error("Failed to load seller catalog:", e);
      }
    }

    async function handleCreateProduct(e) {
      e.preventDefault();
      const storeName = activeSeller.storeName || activeSeller.email.split('@')[0];
      const body = {
        name: document.getElementById('pName').value,
        category: document.getElementById('pCategory').value,
        price: parseFloat(document.getElementById('pPrice').value),
        imageUrl: document.getElementById('pImageUrl').value || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600',
        brand: document.getElementById('pBrand').value || 'Generic',
        sellerStoreName: storeName,
        sellerTier: activeSeller.permission || 'SILVER'
      };

      const res = await fetch('/api/v1/products', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (activeSeller.token || '')
        },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        alert("Product published live on Indians Market!");
        document.getElementById('productListingModal').classList.add('hidden');
        loadSellerProducts();
      }
    }

    function logoutMerchant() {
      localStorage.removeItem('im_seller_session');
      activeSeller = null;
      location.reload();
    }

    window.onload = () => {
      if (activeSeller && activeSeller.email) {
        initializeDashboard();
      }
    };
  </script>
</body>
</html>
